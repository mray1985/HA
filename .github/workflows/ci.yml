name: CI — HA Tax service Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Unit & Integration Tests (Vitest)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shared engine tests
        run: npm test -w shared

      - name: Run preparer local-AI tests
        run: npm test -w @hatax/local-ai

      - name: Run server tests
        run: npm test -w server

  # ──────────────────────────────────────────────
  # Job 2: TypeScript Type-Check
  # ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check shared engine
        run: npx tsc -p shared/tsconfig.json --noEmit

      - name: Type-check preparer local-AI package
        run: npx tsc -p local-ai/tsconfig.json --noEmit

      - name: Type-check TaxFact compile-time assertions
        run: npx tsc -p local-ai/tsconfig.tests.json --noEmit

      - name: Type-check individual app
        run: npx tsc -p apps/individual/tsconfig.json --noEmit

      - name: Type-check preparer app
        run: npx tsc -p apps/preparer/tsconfig.json --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────
  # Job 3: E2E Tests (Playwright — Chromium only in CI)
  # ──────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright, ${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [individual, preparer]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/${{ matrix.app }}

      - name: Run E2E tests (Chromium)
        run: npx playwright test --project=chromium
        working-directory: apps/${{ matrix.app }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 4: Build Check
  # ──────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared engine
        run: npm run build -w shared

      - name: Build individual app
        run: npm run build:individual

      - name: Build preparer app
        run: npm run build:preparer
