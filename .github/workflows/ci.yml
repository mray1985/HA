name: CI — HATax (individual and preparer apps)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository holds two self-contained apps, each with its own engine,
# server, client and lockfile. Every job runs once per app, inside that app.

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Unit & Integration Tests (Vitest)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [individual, preparer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test -w shared

      - name: Run local-AI tests
        if: matrix.app == 'preparer'
        run: npm test -w local-ai

      - name: Run server tests
        run: npm test -w server

  # ──────────────────────────────────────────────
  # Job 2: TypeScript Type-Check
  # ──────────────────────────────────────────────
  typecheck:
    name: TypeScript Check (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [individual, preparer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check engine
        run: npx tsc -p shared/tsconfig.json --noEmit

      - name: Type-check local-AI package
        if: matrix.app == 'preparer'
        run: |
          npx tsc -p local-ai/tsconfig.json --noEmit
          npx tsc -p local-ai/tsconfig.tests.json --noEmit

      - name: Type-check client
        run: npx tsc -p client/tsconfig.json --noEmit

      - name: Type-check server
        run: npx tsc -p server/tsconfig.json --noEmit

      # The desktop app bundles the server, local-ai and engine into its main
      # process; a change that breaks the bundle fails here. No Electron
      # download (install scripts off) — packaging needs the model files.
      - name: Bundle the desktop app's main process
        if: matrix.app == 'preparer'
        working-directory: preparer/desktop
        run: |
          npm ci --ignore-scripts
          node build.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────
  # Job 3: E2E Tests (Playwright — Chromium only in CI)
  # ──────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright, ${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [individual, preparer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Chromium)
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.app }}
          path: ${{ matrix.app }}/client/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 4: Build Check
  # ──────────────────────────────────────────────
  build:
    name: Production Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [individual, preparer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build:shared

      - name: Build client
        run: npm run build
